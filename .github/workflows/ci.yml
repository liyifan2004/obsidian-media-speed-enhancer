# CI for Media Speed Enhancer.
#
# Runs the same gate the project uses locally (`npm run verify`):
#   typecheck (tsc) → vitest → esbuild build
#
# The plugin used to have no test suite at all (the codebase was almost
# entirely DOM manipulation against real media elements, so the testable
# surface was thin). The speed rules have since been extracted into
# src/speed.ts — a pure module with no obsidian/DOM dependency — and are
# covered by test/speed.test.ts.
#
# Every push and pull request runs this. It is deliberately separate from the
# release workflow: CI proves the tree is green, the release workflow proves
# the published artifacts were built from this exact tree.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # ESLint —— 与 Obsidian 商店审查同一份规则集。
      #
      # 1.0.42 因为「设置标题含插件名」「没实现 getSettingDefinitions()」
      # 「多余的 as 断言」等被商店审查打回，插件从目录列表里下架。
      # eslint-plugin-obsidianmd 是官方提供的自查工具，审查用的正是它这套规则，
      # 接进 CI 意味着这些问题在**提交时**就被拦下。
      - name: ESLint (Obsidian guidelines)
        run: npm run lint

      # CSS lint —— 同一份审查规则集的 CSS 部分。
      #
      # 配置见 stylelint.config.mjs：强制 !important / :has() 两条
      # 行为性规则，纯风格类规则关闭（存量 CSS 早于这套规则）。
      - name: CSS lint
        run: npm run lint:styles

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build
